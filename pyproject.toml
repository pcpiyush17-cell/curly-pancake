[project]
name = "mira-v01"
version = "0.1.0"
description = "Backend vertical slice for Mira, a desktop AI execution companion."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
ai = [
  "openai>=1.68,<3",
]

[tool.setuptools]
packages = ["mira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
